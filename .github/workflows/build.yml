name: Build Desktop Executables

on:
  push:
    paths:
      - 'main.py'
      - 'fruit-ninja.spec'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame-ce

      - name: Build with PyInstaller
        run: pyinstaller fruit-ninja.spec

      - name: Archive Windows executable
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Fruit-Ninja.exe -DestinationPath fruit-ninja-windows.zip

      - name: Archive Linux executable
        if: runner.os == 'Linux'
        run: tar -czvf fruit-ninja-linux.tar.gz -C dist Fruit-Ninja

      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: zip -j fruit-ninja-macos.zip dist/Fruit-Ninja

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fruit-ninja-${{ runner.os }}
          path: |
            fruit-ninja-*.zip
            fruit-ninja-*.tar.gz

  release:
    name: Create GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release and upload files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Fruit-Ninja v${{ github.run_number }}
          files: |
            artifacts/fruit-ninja-Windows/fruit-ninja-windows.zip
            artifacts/fruit-ninja-Linux/fruit-ninja-linux.tar.gz
            artifacts/fruit-ninja-macOS/fruit-ninja-macos.zip

      - name: Setup Butler
        uses: remarkablegames/setup-butler@v1

      - name: Publish Windows to itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          mkdir -p push_win
          cp artifacts/fruit-ninja-Windows/fruit-ninja-windows.zip push_win/
          butler push push_win ShivamKR12/fruit-ninja:windows --userversion v${{ github.run_number }}

      - name: Publish Linux to itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          mkdir -p push_linux
          cp artifacts/fruit-ninja-Linux/fruit-ninja-linux.tar.gz push_linux/
          butler push push_linux ShivamKR12/fruit-ninja:linux --userversion v${{ github.run_number }}

      - name: Publish macOS to itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          mkdir -p push_mac
          cp artifacts/fruit-ninja-macOS/fruit-ninja-macos.zip push_mac/
          butler push push_mac ShivamKR12/fruit-ninja:mac --userversion v${{ github.run_number }}
